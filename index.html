<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English Master">
<link rel="manifest" href="manifest.json">
<title>English Master</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--fg:#1b1d2a;--mut:#6b7086;--accent:#4f46e5;--acc2:#06b6d4;--chip:#e9e9f5;--ok:#16a34a;--bad:#dc2626;--line:#e3e5f0}
body.dark{--bg:#0f1220;--card:#1a1e33;--fg:#eef0ff;--mut:#9aa0bf;--accent:#7c79ff;--chip:#262b47;--line:#2c3150}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px}
.top h1{font-size:20px;margin:0}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
main>*{animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:var(--mut);min-height:56px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
nav .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:600}
input,textarea,select{font-size:16px;font-family:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:90px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;border:0}
.hero .mut{color:#e0e7ff}
.center{text-align:center}
h2{font-size:22px;margin:8px 0 2px}
h3{margin:8px 0}
.mut{color:var(--mut)}
.sm{font-size:13px}
.big{font-size:34px;font-weight:700;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{min-height:46px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:600;padding:0 16px;width:100%;margin:4px 0;display:block}
.btn.alt{background:var(--chip);color:var(--fg)}
.btn.sm{width:auto;min-height:34px;font-size:14px;padding:0 12px;margin:0}
.btn:disabled{opacity:.45}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.seg button{flex:1;min-width:60px;min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .v{font-size:20px;font-weight:700}
.bar{height:8px;background:var(--chip);border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--acc2))}
.ex{padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sp{background:var(--chip);border:0;border-radius:10px;min-width:40px;min-height:36px;font-size:16px;color:var(--fg)}
.formula{font-family:ui-monospace,Menlo,monospace;background:var(--chip);padding:10px;border-radius:12px;font-size:14px;white-space:pre-wrap}
.task{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.chk{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:#fff;font-size:20px;font-weight:700}
.chk.on{background:var(--ok);border-color:var(--ok)}
.row-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;width:100%;text-align:left;color:var(--fg);min-height:56px}
.num{width:38px;height:38px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 38px}
.num.d{background:var(--ok);color:#fff}
.num.c{background:var(--accent);color:#fff}
.lk{opacity:.5}
.opt{display:block;width:100%;text-align:left;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-size:16px;padding:10px 14px;margin:6px 0}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.15)}
.opt.bad{border-color:var(--bad);background:rgba(220,38,38,.12)}
.chip{display:inline-block;border-radius:12px;border:0;background:var(--accent);color:#fff;padding:9px 12px;margin:4px;font-size:16px}
.chip.alt{background:var(--chip);color:var(--fg)}
.build{min-height:52px;border-bottom:2px dashed var(--line);padding:6px 0;margin-bottom:10px}
.fb{border-radius:14px;padding:12px;margin:10px 0;border:1px solid var(--line)}
.fb.good{background:rgba(22,163,74,.12);border-color:var(--ok)}
.fb.bad{background:rgba(220,38,38,.1);border-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cal button{aspect-ratio:1;border-radius:8px;border:0;font-size:11px;background:var(--chip);color:var(--fg);padding:0}
.cal .d{background:var(--ok);color:#fff}
.cal .c{outline:2px solid var(--accent)}
.cal .l{opacity:.35}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{border-radius:14px;padding:10px;background:var(--chip);font-size:13px}
.badge.on{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#111}
.flashcard{min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
details summary{min-height:36px;display:flex;align-items:center;cursor:pointer}
</style>
</head>
<body>

    <h1>English Master</h1>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}

const dn=()=>Math.floor(Date.now()/864e5);

function curDay(){for(let d=1;d<=60;d++)if(S.done[d]===undefined)return d;return 60;}
function unlocked(d){return d===1||S.done[d-1]!==undefined||S.done[d]!==undefined;}
function touch(){const k=dkey(new Date());if(!S.days.includes(k))S.days.push(k);}
function streak(){let c=0;const d=new Date();if(!S.days.includes(dkey(d)))d.setDate(d.getDate()-1);while(S.days.includes(dkey(d))){c++;d.setDate(d.getDate()-1);}return c;}
function todayMins(){return S.mins[dkey(new Date())]||0;}
function addMins(m,sign){const k=dkey(new Date());S.mins[k]=Math.max(0,(S.mins[k]||0)+sign*m);}

function avgScore(){const v=Object.values(S.best);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1500);}

/* ============ QUIZ ENGINE ============ */
let Q=null, openDay=null, tab='home', vTab='list', vFilter='all', vQ='', card=null, flipped=false;
function mkQuiz(gen,meta){const q={gen,meta,qs:gen(),i:0,c:0,done:false,fb:null,picked:[],pool:[],pct:0};initQ(q);return q;}
function initQ(q){
 const cur=q.qs[q.i];q.picked=[];q.fb=null;
 q.pool=cur&&cur.type==='order'?shuffle(cur.words).map(w=>({w,used:false})):[];
}
function answer(ok,ex){
 const q=Q.qs[Q.i];
 Q.fb={ok,pick:ex.pick,why:q.why,ans:q.ans||q.sample};
 if(ok)Q.c++;
 if(q.type==='mc'){
  if(ok){S.wrong=S.wrong.filter(w=>w.prompt!==q.prompt);}
  else{if(!S.wrong.some(w=>w.prompt===q.prompt)){S.wrong.push({prompt:q.prompt,opts:q.opts,ans:q.ans,why:q.why,sw:q.sw});}if(S.wrong.length>100)S.wrong.shift();}
 }
 if(q.sw)srsUpdate(q.sw,ok);
}
function qChoose(i){const q=Q.qs[Q.i];if(Q.fb||q.type!=='mc')return;const pick=q.opts[i];answer(pick===q.ans,{pick});}
function qPick(idx){const q=Q.qs[Q.i];if(Q.fb)return;if(Q.pool[idx].used)return;Q.pool[idx].used=true;Q.picked.push(idx);}
function qUndo(p){if(Q.fb)return;const idx=Q.picked[p];Q.pool[idx].used=false;Q.picked.splice(p,1);}
function qCheck(){
 const q=Q.qs[Q.i];if(Q.fb)return;
 if(q.type==='order'){const built=Q.picked.map(i=>Q.pool[i].w).join(' ');answer(built===q.ans,{pick:built});}
 else if(q.type==='create'){const v=(document.getElementById('cin')||{value:''}).value.trim();const ok=v.toLowerCase().includes(q.key.toLowerCase())&&v.split(/\s+/).length>=3;answer(ok,{pick:v});}
}
function qNext(){
 Q.i++;
 if(Q.i>=Q.qs.length){finishQuiz();}
 else initQ(Q);
}
function finishQuiz(){
 const q=Q;q.pct=Math.round(q.c/q.qs.length*100);q.done=true;
 S.log.push({d:q.meta.day||q.meta.mode,pct:q.pct,t:Date.now()});if(S.log.length>200)S.log.shift();
 if(q.meta.day){
  const d=q.meta.day;S.best[d]=Math.max(S.best[d]||0,q.pct);
  if(q.pct>=lvThr(LESSONS[d-1].lv)){S.done[d]=Math.max(S.done[d]||0,q.pct);}
  touch();
 }else touch();
}

  <div class="card"><h3>Өдрийн зорилтот цаг</h3><div class="mut sm">Өдрийн даалгаврын минут энэ цагт тааруулан өөрчлөгдөнө</div>
   <div class="seg">${[30,60,120,240].map(v=>`<button class="${S.goal===v?'on':''}" data-act="set" data-k="goal" data-v="${v}">${v} ${tr('mins')}</button>`).join('')}</div></div>
  <div class="card"><h3>${tr('install')}</h3><p class="sm mut">${tr('installT')}</p></div>
  <div class="card"><button class="btn" style="background:#dc2626" data-act="reset">${tr('reset')}</button></div>`;
}

/* ============ RENDER & ACTIONS ============ */
function render(){
 applyTheme();
 $('#langBtn').textContent=S.lang==='mn'?'EN':'МН';
 document.querySelectorAll('nav [data-l]').forEach(s=>s.textContent=tr(s.dataset.l));
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab&&!openDay&&!Q));
 const v=$('#view');
 if(Q){v.innerHTML=quizHTML();return;}
 if(openDay){v.innerHTML=lessonHTML(openDay);return;}
 const map={home:homeV,lessons:lessonsV,vocab:vocabV,practice:practiceV,progress:progressV,settings:settingsV};
 v.innerHTML=map[tab]();
 v.scrollTop=0;
}
function act(a,d){
 switch(a){
  case 'tab':tab=d.t;openDay=null;Q=null;break;
  case 'open':{const n=+d.d;if(n>=1&&n<=60&&unlocked(n)){openDay=n;Q=null;tab='lessons';}break;}
  case 'back':openDay=null;Q=null;break;
  case 'start':Q=mkQuiz(()=>lessonQs(+d.d),{day:+d.d});break;
  case 'retryQ':Q=mkQuiz(Q.gen,Q.meta);break;
  case 'exitQ':Q=null;break;
  case 'qopt':qChoose(+d.i);break;
  case 'qpick':qPick(+d.i);break;
  case 'qundo':qUndo(+d.i);break;
  case 'qcheck':qCheck();break;
  case 'qnext':qNext();break;
  case 'mix':Q=mkQuiz(()=>mixQs(10),{mode:'mix'});break;
  case 'lvl':Q=mkQuiz(()=>levelQs(d.lv),{mode:'lvl'});break;
  case 'vq':Q=mkQuiz(()=>vocabQs(10),{mode:'vq'});break;
  case 'replay':Q=mkQuiz(()=>S.wrong.slice(0,10).map(w=>({type:'mc',...w})),{mode:'replay'});break;
  case 'task':toggleTask(openDay,d.k);break;
  case 'sayAll':playAll(+d.d);break;
  case 'say':say(d.t);break;
  case 'saveWrite':{const el=$('#wtxt');if(el){S.writing[+d.d]=el.value;touch();toast(tr('saved'));}break;}
  case 'fav':{const i=S.fav.indexOf(d.w);if(i>=0)S.fav.splice(i,1);else S.fav.push(d.w);break;}
  case 'vtab':vTab=d.v;if(d.v==='cards')nextCard();break;
  case 'vfilter':vFilter=d.v;nextCard();break;
  case 'flip':flipped=!flipped;break;
  case 'rate':{if(card){srsUpdate(card.en,d.ok==='1');}nextCard();break;}
  case 'set':{S[d.k]=(d.k==='pass'||d.k==='goal')?+d.v:d.v;break;}
  case 'reset':if(confirm(tr('reset')+'?')){localStorage.removeItem(KEY);S=JSON.parse(JSON.stringify(DEF));openDay=null;Q=null;toast(tr('resetOk'));}break;
  case 'lang':S.lang=S.lang==='mn'?'en':'mn';break;
 }
 save();render();
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el||el.disabled)return;
 act(el.dataset.act,el.dataset);
});
document.addEventListener('input',e=>{
 if(e.target.id==='vsearch'){vQ=e.target.value;const l=$('#vlist');if(l)l.innerHTML=vocabListHTML();}
});
if(window.matchMedia){matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{applyTheme();});}

/* ============ INIT ============ */
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
